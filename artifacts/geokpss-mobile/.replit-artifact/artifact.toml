kind = "mobile"
previewPath = "/"
title = "GeoKPSS"
description = "KPSS ve AGS coğrafya hazırlığı için Türkiye haritalarını katman ve oluşum türüne göre keşfetme, harita quizleri çözme, konuları takip etme ve kişisel kodlama notları tutma uygulaması."
version = "1.0.0"
id = "artifacts/geokpss-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 26255

[services.development]
run = "pnpm --filter @workspace/geokpss-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/geokpss-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/geokpss-mobile", "run", "serve" ]

[services.env]
PORT = "26255"
BASE_PATH = "/"
